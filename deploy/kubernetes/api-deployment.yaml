apiVersion: apps/v1
kind: Deployment
metadata:
  name: soroban-lens-api
  namespace: soroban-lens
  labels:
    app.kubernetes.io/name: soroban-lens
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: soroban-lens
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: soroban-lens
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soroban-lens
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: soroban-lens
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/soroban-forge-labs/soroban-lens-node:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "packages/api/dist/bin.js"]
          envFrom:
            - configMapRef:
                name: soroban-lens-config
            - secretRef:
                name: soroban-lens-secret
          env:
            - name: LENS_DB_PATH
              value: "/app/data/lens.db"
            - name: LENS_DATA_DIR
              value: "/app/data"
            - name: NODE_ENV
              value: "production"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soroban-lens-data
