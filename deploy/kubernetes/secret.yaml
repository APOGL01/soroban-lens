apiVersion: v1
kind: Secret
metadata:
  name: soroban-lens-secret
  namespace: soroban-lens
  labels:
    app.kubernetes.io/part-of: soroban-lens
type: Opaque
stringData:
  # Commercial RPC providers authenticate via headers.
  # Format: comma-separated 'Name: value' pairs.
  # Example: "Authorization: Bearer abc123,X-Custom-Header: value"
  LENS_RPC_HEADERS: ""
  # Comma-separated API keys for the query API (optional).
  # When set, requests must send X-API-Key or Authorization: Bearer <key>.
  LENS_API_KEYS: ""
