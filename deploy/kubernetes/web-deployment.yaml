apiVersion: apps/v1
kind: Deployment
metadata:
  name: soroban-lens-web
  namespace: soroban-lens
  labels:
    app.kubernetes.io/name: soroban-lens
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: soroban-lens
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soroban-lens
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soroban-lens
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: soroban-lens
    spec:
      containers:
        - name: web
          image: ghcr.io/soroban-forge-labs/soroban-lens-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
